name: Probe2

on: workflow_dispatch

jobs:
  bgutil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start PO token server
        run: |
          docker run -d --name bg -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 10
          docker logs bg | tail -3

      - name: Try with PO tokens
        run: |
          pip install -q yt-dlp bgutil-ytdlp-pot-provider
          for c in default mweb tv web_safari; do
            echo "=== client: $c ==="
            if [ "$c" = default ]; then
              args=""
            else
              args="--extractor-args youtube:player_client=$c"
            fi
            if timeout 120 yt-dlp -g -f "bestvideo/best" --no-warnings $args "https://www.youtube.com/watch?v=ZlQLmBNLz-c" > /tmp/u.txt 2> /tmp/e.txt; then
              echo "OK $(head -c 80 /tmp/u.txt)"
            else
              echo "FAIL $(grep -m1 ERROR /tmp/e.txt || tail -1 /tmp/e.txt)"
            fi
          done
          echo "=== verbose diagnostics ==="
          yt-dlp -v -g -f "bestvideo/best" "https://www.youtube.com/watch?v=ZlQLmBNLz-c" 2>&1 | grep -iE "pot|token|client|ERROR" | head -20
