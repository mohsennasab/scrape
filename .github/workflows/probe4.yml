name: Probe4

on: workflow_dispatch

jobs:
  cookiecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check cookie plumbing
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          pip install -q yt-dlp yt-dlp-ejs
          node --version
          echo "secret length: ${#YT_COOKIES}"
          printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          wc -c "$RUNNER_TEMP/cookies.txt"
          wc -l "$RUNNER_TEMP/cookies.txt"
          if timeout 180 yt-dlp -v -g -f "bestvideo/best" --js-runtimes node --cookies "$RUNNER_TEMP/cookies.txt" "https://www.youtube.com/watch?v=jJI5w_RVGtQ" > /tmp/u.txt 2> /tmp/e.txt; then
            echo "RESULT OK $(head -c 60 /tmp/u.txt)"
          else
            echo "RESULT FAIL"
            grep -iE "cookie|jsc|runtime|pot|ERROR|WARNING" /tmp/e.txt | head -12
          fi
