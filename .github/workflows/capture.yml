name: Snapshots

on:
  schedule:
    - cron: "4 * * * *"
    - cron: "19 * * * *"
    - cron: "34 * * * *"
    - cron: "49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: capture-window
  cancel-in-progress: false

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 178
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          command -v ffmpeg > /dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install -q -r requirements.txt

      # YouTube invalidates a cookie snapshot that keeps reappearing
      # from fresh cloud addresses, so the job carries an evolving copy
      # between runs the way a browser would, seeded from the secret
      # only when a new secret starts a new chain.
      - name: Bring back cookie state
        uses: actions/cache/restore@v4
        with:
          path: ~/.cookie-state
          key: cookie-state-${{ github.run_id }}
          restore-keys: cookie-state-

      # GitHub fires cron schedules for small repos far less often than
      # asked, sometimes hourly. So one run keeps going for almost three
      # hours, waking every five minutes and pushing as it goes. Each
      # camera's own cadence decides whether a wake up captures it.
      # Queued runs take over the moment a window ends.
      - name: Take photos on schedule
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Capturing ends for good at 2:15 pm Juneau time on August 14,
          # after which the job switches this workflow off.
          deadline=1786745700
          if [ "$(date +%s)" -ge "$deadline" ]; then
            gh workflow disable capture.yml
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$YT_COOKIES" ]; then
            gen=$(printf '%s' "$YT_COOKIES" | sha256sum | cut -c1-12)
            mkdir -p ~/.cookie-state
            state=~/.cookie-state/cookies-$gen.txt
            if [ ! -s "$state" ]; then
              printf '%s' "$YT_COOKIES" > "$state"
            fi
            export YT_COOKIES_FILE="$state"
          fi
          push_photos() {
            git add photos
            if git diff --cached --quiet; then return 0; fi
            git commit -m "Photos for $(TZ=America/Juneau date '+%Y-%m-%d %H:%M %Z')"
            tries=0
            until git push; do
              tries=$((tries+1))
              if [ "$tries" -ge 3 ]; then return 1; fi
              git pull --rebase
              sleep 5
            done
          }
          finish=$(( $(date +%s) + 170 * 60 ))
          if [ "$finish" -gt "$deadline" ]; then
            finish=$deadline
          fi
          while true; do
            start=$(date +%s)
            python capture.py || true
            push_photos || true
            next=$(( (start / 300 + 1) * 300 ))
            now=$(date +%s)
            if [ "$next" -ge "$finish" ]; then
              break
            fi
            if [ "$next" -gt "$now" ]; then
              sleep $(( next - now ))
            fi
          done
          if [ "$finish" -eq "$deadline" ]; then
            gh workflow disable capture.yml
          fi

      - name: Keep cookie state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cookie-state
          key: cookie-state-${{ github.run_id }}
